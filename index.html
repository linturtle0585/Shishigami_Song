<!DOCTYPE html>
<html lang="zh-TW" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>獅子神レオナ歌枠曲目快速查詢</title>
  <!-- Bootstrap 5 CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- WordCloud2.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/wordcloud@1.2.2/src/wordcloud2.min.js"></script>
</head>
<body class="bg-dark text-light min-vh-100 p-3 p-md-4">
  <div class="container my-2" style="max-width: 1200px;">
    <!-- 頁面標題 -->
    <header class="d-flex flex-column flex-md-row align-items-md-center justify-content-between border-bottom border-secondary pb-3 mb-4 gap-2">
      <div>
        <h1 class="h2 fw-bold text-warning mb-1">獅子神レオナ歌枠曲目快速查詢</h1>
        <p class="text-secondary small mb-0">快速查詢獅子神レオナ的歌枠曲目</p>
      </div>
      <div id="statusMessage" class="badge rounded-pill bg-success-subtle text-success border border-success px-3 py-2 fw-normal">
        歌枠資料截至：2026/08/09
      </div>
    </header>
    <!-- 視覺化區域：文字雲 -->
    <section class="card bg-dark text-light border-secondary p-4 rounded-3 shadow mb-4">
      <h2 class="h5 fw-bold mb-3">熱門歌曲排行榜</h2>
      <!-- 文字雲畫布容器 -->
      <div class="position-relative w-100 rounded overflow-hidden d-flex align-items-center justify-content-center bg-black bg-opacity-25" style="height: 400px;">
        <canvas id="wordCloudCanvas" class="w-100 h-100"></canvas>
        <!-- 滑鼠 Hover 浮動提示框 (Tooltip) -->
        <div id="tooltip" class="position-absolute d-none bg-dark border border-white text-white small px-3 py-1 rounded shadow z-3"></div>
      </div>
    </section>
    <!-- 歌曲搜尋與直播列表展開區塊 -->
    <section class="card bg-dark text-light border-secondary p-4 rounded-3 shadow">
      <div class="d-flex flex-column flex-md-row align-items-md-center justify-content-between border-bottom border-secondary pb-3 mb-3 gap-3">
        <div class="flex-grow-1">
          <h2 class="h5 fw-bold mb-1">歌曲搜尋</h2>
          <p class="text-secondary small mb-0">搜尋歌曲並點擊展開，可展開查看該曲目出現的直播場次與時間點連結</p>
        </div>
        <div class="d-flex gap-2 flex-md-grow-0 ms-md-auto">
          <input type="text" id="searchInput" class="form-control bg-dark text-light border-secondary flex-grow-1" placeholder="輸入歌曲名稱搜尋..." style="max-width: 300px;">
          <button id="luckyBtn" class="btn btn-success fw-bold text-nowrap d-flex align-items-center gap-1 shadow-sm">
            <span>🎲</span>我不知道要聽什麼
          </button>
        </div>
      </div>
      <!-- 歌曲結果卡片列表 (動態生成) -->
      <div id="songListContainer" class="vstack gap-2 overflow-auto pe-1" style="max-height: 600px;">
        <!-- 展開式卡片會在這裡動態渲染 -->
      </div>
    </section>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./index.js"></script>
</body>
</html>
